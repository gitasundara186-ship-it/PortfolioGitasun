```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Trigonometri</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        html {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

  
    <header class="p-6">
        <div class="max-w-4xl mx-auto">

            <h1 class="text-3xl md:text-4xl font-bold">
                Kalkulator Trigonometri
            </h1>

            <p class="mt-2 text-slate-500">
                Menghitung nilai Sin, Cos, dan Tan
            </p>

        </div>
    </header>


    <main class="px-6 pb-16">

        <div class="max-w-4xl mx-auto grid md:grid-cols-3 gap-6">

            <section class="md:col-span-1 bg-white rounded-2xl shadow p-5 border border-slate-200">

                <h2 class="font-semibold text-lg">
                    1) Pilih Operasi
                </h2>

                <label for="trig" class="sr-only">
                    Operasi Trigonometri
                </label>

                <select id="trig"
                    class="mt-3 w-full rounded-xl border border-slate-300 p-2">

                    <option value="sin">Sin</option>
                    <option value="cos">Cos</option>
                    <option value="tan">Tan</option>

                </select>

                <div class="mt-6">

                    <label class="block text-sm font-medium">
                        Satuan Sudut
                    </label>

                    <select id="satuan"
                        class="mt-2 w-full rounded-xl border border-slate-300 p-2">

                        <option value="derajat">Derajat (°)</option>
                        <option value="radian">Radian</option>

                    </select>

                </div>

            </section>

            <section class="md:col-span-2 bg-white rounded-2xl shadow p-5 border border-slate-200">

                <h2 class="font-semibold text-lg">
                    2) Isi Parameter
                </h2>

                <form id="paramForm"
                    class="mt-4 grid sm:grid-cols-2 gap-4">

          
                </form>


                <div class="mt-6 flex flex-wrap gap-3">

                    <button id="hitungBtn"
                        class="px-4 py-2 rounded-xl bg-indigo-600 text-white
                               font-semibold shadow hover:bg-indigo-700">

                        Hitung

                    </button>


                    <button id="resetBtn"
                        type="button"
                        class="px-4 py-2 rounded-xl bg-slate-100
                               text-slate-700 font-semibold
                               border border-slate-200">

                        Reset

                    </button>

                </div>

                <div id="notif"
                    class="hidden mt-4 text-sm">
                </div>

            </section>

            <section class="md:col-span-3 bg-white rounded-2xl shadow p-5 border border-slate-200">

                <h2 class="font-semibold text-lg">
                    3) Rumus & Hasil
                </h2>


                <div class="mt-3 grid md:grid-cols-2 gap-4">

                    <div class="rounded-xl border border-slate-200 p-4">

                        <h3 class="font-semibold">
                            Rumus
                        </h3>

                        <p id="rumusText"
                            class="mt-2 text-slate-700 text-lg">
                            —
                        </p>

                        <ul id="catatan"
                            class="mt-3 text-xs text-slate-500 list-disc list-inside">
                        </ul>

                    </div>


                    <div class="rounded-xl border border-slate-200 p-4">

                        <h3 class="font-semibold">
                            Hasil
                        </h3>

                        <p id="hasilText"
                            class="mt-2 text-2xl font-bold">
                            —
                        </p>

                        <p id="detailText"
                            class="mt-1 text-sm text-slate-600">
                            Isi parameter lalu klik Hitung.
                        </p>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <footer class="px-6 pb-10">

        <div class="max-w-4xl mx-auto text-xs text-slate-500">

            Latihan jQuery

        </div>

    </footer>


    <script>

        const TRIGONOMETRY = {

            sin: {

                name: 'Sin',

                fields: [
                    {
                        key: 'sudut',
                        label: 'Sudut',
                        placeholder: 'contoh: 30'
                    }
                ],

                formula: (p, satuan) => {

                    let sudut = p.sudut;

                    if (satuan === 'derajat') {
                        sudut = sudut * Math.PI / 180;
                    }

                    return Math.sin(sudut);

                },

                formulaText: 'sin(θ) = sisi depan / sisi miring',

                notes: [
                    'θ = sudut',
                    'Hasil berupa nilai sinus'
                ]

            },


            cos: {

                name: 'Cos',

                fields: [
                    {
                        key: 'sudut',
                        label: 'Sudut',
                        placeholder: 'contoh: 60'
                    }
                ],

                formula: (p, satuan) => {

                    let sudut = p.sudut;

                    if (satuan === 'derajat') {
                        sudut = sudut * Math.PI / 180;
                    }

                    return Math.cos(sudut);

                },

                formulaText: 'cos(θ) = sisi samping / sisi miring',

                notes: [
                    'θ = sudut',
                    'Hasil berupa nilai cosinus'
                ]

            },


            tan: {

                name: 'Tan',

                fields: [
                    {
                        key: 'sudut',
                        label: 'Sudut',
                        placeholder: 'contoh: 45'
                    }
                ],

                formula: (p, satuan) => {

                    let sudut = p.sudut;

                    if (satuan === 'derajat') {
                        sudut = sudut * Math.PI / 180;
                    }

                    return Math.tan(sudut);

                },

                formulaText: 'tan(θ) = sisi depan / sisi samping',

                notes: [
                    'θ = sudut',
                    'Hasil berupa nilai tangen'
                ]

            }

        };


        function renderFields(trigKey) {

            const cfg = TRIGONOMETRY[trigKey];

            const $form = $('#paramForm');

            $form.empty();


            cfg.fields.forEach(function (f) {

                const fieldId = `field_${f.key}`;

                const html = `

                    <div class="space-y-2">

                        <label
                            for="${fieldId}"
                            class="block text-sm font-medium">

                            ${f.label}

                        </label>


                        <input
                            id="${fieldId}"
                            name="${f.key}"
                            type="number"
                            step="any"
                            placeholder="${f.placeholder}"
                            class="w-full rounded-xl border border-slate-300 p-2"
                        />

                    </div>

                `;

                $form.append(html);

            });


            $('#rumusText').text(cfg.formulaText);


            const $notes = $('#catatan').empty();

            cfg.notes.forEach(function (n) {

                $notes.append(`<li>${n}</li>`);

            });


            $('#hasilText').text('—');

            $('#detailText').text(
                'Isi parameter lalu klik Hitung.'
            );


            $('#notif')
                .addClass('hidden')
                .text('');

        }


        function collectParams(trigKey) {

            const cfg = TRIGONOMETRY[trigKey];

            const params = {};

            let valid = true;

            let firstInvalidLabel = null;


            cfg.fields.forEach(function (f) {

                const val = parseFloat(
                    $(`[name="${f.key}"]`).val()
                );


                if (!isFinite(val)) {

                    valid = false;

                    firstInvalidLabel =
                        firstInvalidLabel || f.label;

                }


                params[f.key] = val;

            });


            return {
                params,
                valid,
                firstInvalidLabel
            };

        }


        function showError(msg) {

            $('#notif')
                .removeClass('hidden')
                .addClass(
                    'mt-4 text-sm border rounded-lg p-3 bg-red-50 text-red-700 border-red-200'
                )
                .text(msg);

        }


        $(function () {


            renderFields($('#trig').val());


            $('#trig').on('change', function () {

                renderFields(this.value);

            });


            $('#resetBtn').on('click', function () {

                renderFields($('#trig').val());

                $('#paramForm')
                    .find('input')
                    .val('');

            });


            $('#hitungBtn').on('click', function (e) {

                e.preventDefault();


                const trigKey = $('#trig').val();

                const satuan = $('#satuan').val();

                const cfg = TRIGONOMETRY[trigKey];


                const {
                    params,
                    valid,
                    firstInvalidLabel
                } = collectParams(trigKey);


                if (!valid) {

                    showError(
                        `Nilai pada "${firstInvalidLabel}" harus berupa angka.`
                    );

                    $('#hasilText').text('—');

                    $('#detailText').text(
                        'Periksa kembali input Anda.'
                    );

                    return;

                }


                try {

                    const hasil =
                        cfg.formula(params, satuan);


                    // Pembulatan
                    const pretty =
                        Math.round(hasil * 10000) / 10000;


                    // Menampilkan hasil
                    $('#hasilText').text(pretty);


                    $('#detailText').text(
                        `${cfg.name} dengan sudut ${params.sudut} ${
                            satuan === 'derajat' ? '°' : 'radian'
                        }`
                    );


                    $('#notif')
                        .addClass('hidden')
                        .text('');


                } catch (err) {

                    showError(
                        'Terjadi kesalahan saat menghitung.'
                    );

                    console.error(err);

                }

            });

        });

    </script>

</body>

</html>
```
